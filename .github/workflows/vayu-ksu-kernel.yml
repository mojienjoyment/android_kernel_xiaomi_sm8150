name: vayu kernel (crDroid 17.0 + KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel ref to build (branch/tag/commit in this fork's upstream)"
        required: false
        default: "17.0"
      ksu_ref:
        description: "crDroid ref the hook-patch base + susfs kernel files are taken from (used by every ksu_source; default 16.0-ksu)"
        required: false
        default: "16.0-ksu"
      ksu_source:
        description: "SU driver: 'vendored' = KernelSU-Next snapshot from crDroid 16.0-ksu (ksuver 33281, full susfs) | 'latest' = KernelSU-Next legacy branch (newer, NO susfs) | 'baka' = Baka-SU main (manual hooks + auto-LSM, NO susfs) | 'sukisu' = SukiSU-Ultra builtin, pinned to a verified classic-hook commit (susfs supported)"
        type: choice
        required: false
        default: "vendored"
        options:
          - vendored
          - latest
          - baka
          - sukisu
      ksu_commit:
        description: "(latest/baka/sukisu only) pin the SU repo to a specific commit (empty = branch head for latest/baka, verified 75179fc9 pin for sukisu)"
        required: false
        default: ""
      susfs_mode:
        description: "Build with susfs, without susfs, or both variants"
        type: choice
        required: false
        default: "both"
        options:
          - with
          - without
          - both
      clang_version:
        description: "Toolchain: '19' = clang 19 (verified) | '22' = AOSP clang-r596125 / 22.0.2 (same LLVM revision as the stock crDroid build)"
        type: choice
        required: false
        default: "19"
        options:
          - "19"
          - "22"
      lto_mode:
        description: "LTO: 'full' = stock crDroid full-LTO (uses the swap added by this workflow; slowest link) | 'thin' = ThinLTO from the same Kconfig, near-identical result, far lower link memory | 'none' = no LTO (this is what built fine before)"
        type: choice
        required: false
        default: "full"
        options:
          - full
          - thin
          - none
      rom_zip_url:
        description: "Direct URL of the official crDroid vayu zip for the boot.img repack job (empty = auto-detect newest)"
        required: false
        default: ""
      publish_release:
        description: "Publish a GitHub Release with the zips + boot images (uncheck for test builds: artifacts only)"
        type: boolean
        required: false
        default: false
  # uncomment for a weekly automatic build (scheduled runs never publish
  # a release - the publish_release toggle only exists for manual runs):
  # schedule:
  #   - cron: "0 4 * * 0"

permissions:
  contents: read

concurrency:
  group: vayu-ksu-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  # SourceForge folder holding the official crDroid 13 (Android 17) vayu zips
  SF_LISTING_URL: "https://sourceforge.net/projects/crdroid/files/vayu/13.x/"
  SF_DL_URL: "https://downloads.sourceforge.net/project/crdroid/vayu/13.x/"
  # AOSP prebuilt clang matching the stock crDroid toolchain revision
  # (22.0.2, llvm-r596125 - minus Google's internal PGO/BOLT profiles).
  # r596125 lives on the main-kernel branch (it gets pruned from older
  # branches over time; if this 404s one day, pick a current clang-r*
  # dir from https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/main-kernel/
  # and update it here + in the cache key below.)
  AOSP_CLANG_BASE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive"
  AOSP_CLANG_REF: "clang-r596125"

jobs:
  build-kernel:
    name: Build kernel (vayu + KernelSU-Next)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout kernel source (this fork)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref || '17.0' }}
          fetch-depth: 1

      - name: Cache AOSP clang 22
        if: ${{ (inputs.clang_version || '19') == '22' }}
        uses: actions/cache@v4
        with:
          path: ~/clang-22
          key: aosp-clang-r596125-v1

      - name: Install toolchain and dependencies
        env:
          CLANG: ${{ inputs.clang_version || '19' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison cpio flex git zip zstd \
            libelf-dev libncurses-dev libssl-dev python3 binutils-aarch64-linux-gnu
          if [ "$CLANG" = "22" ]; then
            # AOSP prebuilt clang-r596125 = clang 22.0.2, the exact LLVM
            # revision the stock crDroid kernel is built with.
            if [ ! -x "$HOME/clang-22/bin/clang" ]; then
              ok=""
              for ref in refs/heads/main-kernel refs/heads/main; do
                url="$AOSP_CLANG_BASE/$ref/$AOSP_CLANG_REF.tar.gz"
                echo "trying $url"
                if curl -fL --retry 3 -o /tmp/clang22.tar.gz "$url"; then ok=1; break; fi
              done
              if [ -z "$ok" ]; then
                echo "FATAL: could not download $AOSP_CLANG_REF from AOSP."
                echo "Google may have pruned it - re-run with clang_version=19"
                echo "or update AOSP_CLANG_REF in the workflow (see the comment there)."
                exit 1
              fi
              mkdir -p "$HOME/clang-22"
              tar -xzf /tmp/clang22.tar.gz -C "$HOME/clang-22"
              rm -f /tmp/clang22.tar.gz
            fi
            echo "$HOME/clang-22/bin" >> "$GITHUB_PATH"
            "$HOME/clang-22/bin/clang" --version | head -1
            "$HOME/clang-22/bin/ld.lld" --version
          else
            # clang 19 = the version this pipeline was verified with.
            if ! sudo apt-get install -y -qq clang-19 lld-19 llvm-19 2>/dev/null; then
              curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
              sudo bash /tmp/llvm.sh 19
              sudo apt-get install -y -qq clang-19 lld-19 llvm-19
            fi
            # An LLVM=1 build invokes clang, ld.lld AND the llvm-* binutils
            # under their plain names - the -19 suffixed packages only install
            # suffixed binaries into /usr/bin, so link them all.
            for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-as llvm-strip \
                     llvm-objcopy llvm-objdump llvm-ranlib llvm-readelf \
                     llvm-addr2line llvm-symbolizer; do
              p="$(command -v "$t-19" 2>/dev/null || true)"
              [ -n "$p" ] && sudo ln -sf "$p" "/usr/local/bin/$t"
            done
            clang --version | head -1
            ld.lld --version
          fi

      - name: Add swap for the LTO link
        if: ${{ (inputs.lto_mode || 'full') != 'none' }}
        run: |
          set -e
          free -m
          # The stock full-LTO "LTO vmlinux.o" link needs more memory than
          # the 16 GB runner has (that is what got the build "Killed" with
          # exit 143 before). The big extra swap file on /mnt - the runner's
          # large disk - lets it complete instead of being OOM-killed.
          SWAP_SIZE_MB=40000
          SWAPFILE=""
          for CAND in /mnt /; do
            AVAIL_MB=$(df -Pm "$CAND" | awk 'NR==2 {print $4}')
            if [ "$AVAIL_MB" -gt $((SWAP_SIZE_MB + 4000)) ]; then
              SWAPFILE="$CAND/swapfile-kernel"
              break
            fi
          done
          if [ -z "$SWAPFILE" ]; then
            echo "Not enough free disk for a ${SWAP_SIZE_MB}M swap file - continuing without it"
            exit 0
          fi
          sudo fallocate -l "${SWAP_SIZE_MB}M" "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE" >/dev/null
          sudo swapon "$SWAPFILE" || { echo "swapon failed - continuing without swap"; exit 0; }
          swapon --show || true
          free -m

      - name: Integrate KernelSU-Next (+ susfs) and build
        env:
          KSU_REF: ${{ inputs.ksu_ref || '16.0-ksu' }}
          KSU_SOURCE: ${{ inputs.ksu_source || 'vendored' }}
          KSU_COMMIT: ${{ inputs.ksu_commit || '' }}
          KSU_SUSFS_MODE: ${{ inputs.susfs_mode || 'both' }}
          KSU_LTO: ${{ inputs.lto_mode || 'full' }}
        run: bash ksu-ci/build.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anykernel-zips-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  repack-boot:
    name: Repack official boot.img with the new kernel(s)
    needs: build-kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download built kernel
        uses: actions/download-artifact@v4
        with:
          name: anykernel-zips-${{ github.run_number }}

      - name: Fetch magiskboot (x86_64) and payload-dumper-go
        run: |
          gh release download -R topjohnwu/Magisk -p 'Magisk-v[0-9]*.apk' -O magisk.apk
          unzip -o -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d .
          chmod +x libmagiskboot.so
          curl -fsSL -o pdg.tar.gz \
            https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
          tar -xzf pdg.tar.gz payload-dumper-go
          ./libmagiskboot.so 2>&1 | head -2 || true
          ./payload-dumper-go --help 2>&1 | head -2 || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download official crDroid vayu ROM zip
        run: |
          if [ -n "${{ inputs.rom_zip_url }}" ]; then
            URL="${{ inputs.rom_zip_url }}"
          else
            page="$(curl -fsSL "$SF_LISTING_URL")"
            newest="$(grep -oE 'crDroidAndroid-17\.0-[0-9]{8}-vayu-v13[^"]*\.zip' <<<"$page" | sort -u | sort -V | tail -1)"
            if [ -z "$newest" ]; then
              echo "Could not auto-detect the ROM zip from $SF_LISTING_URL"
              echo "Re-run the workflow and pass rom_zip_url manually."
              exit 1
            fi
            echo "Auto-detected official zip: $newest"
            URL="${SF_DL_URL}${newest}"
          fi
          echo "Downloading $URL ..."
          curl -fL --retry 3 -o rom.zip "$URL"
          ls -la rom.zip

      - name: Extract boot.img and swap the kernel(s)
        run: |
          set -e
          # The official crDroid vayu zip ships boot.img directly inside the
          # zip (no payload.bin) - other/older builds may use the OTA payload
          # format. Handle both.
          LISTING="$(unzip -Z1 rom.zip)"
          echo "--- rom.zip entries (first 25):"
          echo "$LISTING" | head -25
          if echo "$LISTING" | grep -qx 'payload.bin'; then
            echo ">> payload.bin found - extracting with payload-dumper-go"
            ./payload-dumper-go -p boot -o . rom.zip
          else
            BOOT_REL="$(echo "$LISTING" | grep -E '(^|/)boot\.img$' | head -n 1 || true)"
            if [ -z "$BOOT_REL" ]; then
              echo "::error::rom.zip contains neither payload.bin nor boot.img"
              exit 1
            fi
            echo ">> no payload.bin - extracting $BOOT_REL directly from the zip"
            unzip -j -o rom.zip "$BOOT_REL" -d .
          fi
          test -s boot.img
          ls -la boot.img
          # build-meta.env (written by ksu-ci/build.sh) carries the clang
          # version, the build date and the user-facing file stems, so the
          # repacked boot images get the same names as the AnyKernel zips.
          source build-meta.env
          shopt -s nullglob
          IMAGES=(Image-*)
          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "FATAL: no Image-* files in the kernel artifact"; exit 1
          fi
          mkdir -p work && cd work
          cp ../boot.img .
          ../libmagiskboot.so unpack boot.img
          cd ..
          for IMG in "${IMAGES[@]}"; do
            VARIANT="${IMG#Image-}"
            case "$VARIANT" in
              susfs)   STEM="$STEM_susfs" ;;
              nosusfs) STEM="$STEM_nosusfs" ;;
              *)       STEM="" ;;
            esac
            [ -n "$STEM" ] || STEM="kernel-$VARIANT"
            echo ">> repacking boot.img with kernel: $IMG  ->  boot-$STEM.img"
            cp "$IMG" work/kernel
            ( cd work && ../libmagiskboot.so repack boot.img "../boot-$STEM.img" )
          done
          ls -la boot-*

      - name: Upload repacked boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-images-${{ github.run_number }}
          path: boot-*.img
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release (optional)
    needs: [build-kernel, repack-boot]
    if: ${{ inputs.publish_release == true }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download AnyKernel zips + build info
        uses: actions/download-artifact@v4
        with:
          name: anykernel-zips-${{ github.run_number }}
          path: anykernel

      - name: Download repacked boot images
        uses: actions/download-artifact@v4
        with:
          name: boot-images-${{ github.run_number }}
          path: bootimg

      - name: Create the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          source anykernel/build-meta.env
          DATE_PRETTY="${BUILD_DATE:0:4}-${BUILD_DATE:4:2}-${BUILD_DATE:6:2}"
          TAG="${SU_NAME}-${BUILD_DATE}-clang${CLANG_MAJOR}-r${GITHUB_RUN_NUMBER}"
          TITLE="crDroid 17 kernel + ${SU_NAME} (clang ${CLANG_MAJOR}, ${DATE_PRETTY})"

          # ---- variant lines, built from the files that actually exist ----
          ZIP_LINES=""
          shopt -s nullglob
          for z in anykernel/*.zip; do
            b="$(basename "$z")"
            case "$b" in
              *_susfs_*)    ZIP_LINES+="- \`${b}\` - flash in recovery - ${SU_NAME} **with susfs**"$'\n' ;;
              *_no-susfs_*) ZIP_LINES+="- \`${b}\` - flash in recovery - plain ${SU_NAME}, **no susfs**"$'\n' ;;
              *)            ZIP_LINES+="- \`${b}\`"$'\n' ;;
            esac
          done
          BOOT_LINES=""
          for b in bootimg/boot-*.img; do
            BOOT_LINES+="- \`$(basename "$b")\` - stock boot.img with this kernel, for \`fastboot flash boot\`"$'\n'
          done

          if compgen -G "anykernel/*_susfs_*.zip" > /dev/null; then
            SUSFS_NOTE="Both variants are included: the susfs builds add susfs (root hiding) on top of ${SU_NAME}, the no-susfs builds are plain ${SU_NAME}. Pick one."
          else
            SUSFS_NOTE="This build has susfs disabled: it is a plain ${SU_NAME} kernel."
          fi

          # ---- release notes ----
          {
            echo "# crDroid 17 + ${SU_NAME} kernel - POCO X3 Pro (vayu / bhima)"
            echo ""
            echo "This kernel is built from the official **crDroid 17** kernel source for the POCO X3 Pro (vayu / bhima) with **${SU_NAME}** integrated. It is meant to be used on **crDroid 17**."
            echo ""
            echo "- ${SU_NAME}: **${KSU_DESC}**, reports to the manager as ksuver ${KSU_REPORTED}"
            echo "- Manager app: install the **${SU_NAME}** manager from its GitHub releases."
            echo "- ${SUSFS_NOTE}"
            echo ""
            echo "## Important: coming from another custom kernel? Flash the official crDroid 17 dtbo"
            echo ""
            echo "If you have installed **any other custom kernel** before this one, its own dtbo image is currently on your dtbo partition - and this kernel needs the stock one. So before (or right after) installing this kernel, put the **dtbo image of the official crDroid 17 build for vayu** back on the phone:"
            echo ""
            echo "- Easiest: re-flash the official crDroid 17 (vayu) ROM zip once in recovery (same build = no data loss; it rewrites the stock dtbo)."
            echo "- Or extract \`dtbo.img\` from the official ROM zip (payload.bin) and flash just that: install it as an image in recovery, or run \`fastboot flash dtbo dtbo.img\`."
            echo ""
            echo "## Files"
            echo ""
            printf '%s\n' "$ZIP_LINES"
            printf '%s\n' "$BOOT_LINES"
            echo "- \`build-info.txt\` - full build details (kernel release, KSU version, config)"
            echo ""
            echo "## Installation"
            echo ""
            echo "- **Recovery:** flash the \`.zip\` of the variant you want (AnyKernel3 - TWRP / OrangeFox)."
            echo "- **Fastboot:** \`fastboot flash boot\` the matching \`boot-*.img\`."
            echo "- Installs on top of an existing crDroid 17 - no data wipe needed."
            echo ""
            echo "## Build details"
            echo ""
            echo "- Toolchain: clang ${CLANG_MAJOR} (${CLANG_FULL})"
            echo "- LTO: ${LTO_MODE}"
            echo "- Kernel release: ${KRELEASE}"
            echo "- Built on ${DATE_PRETTY} (UTC), CI run r${GITHUB_RUN_NUMBER}"
          } > release-notes.md

          gh release create "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            anykernel/*.zip bootimg/boot-*.img anykernel/build-info.txt

          URL="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url -q .url)"
          echo "Release published: $URL"